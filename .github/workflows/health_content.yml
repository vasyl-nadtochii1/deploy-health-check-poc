name: Branch health (content based)

on:
  pull_request:
    branches: [test, prod]

permissions:
  contents: read
  pull-requests: write   # needed to post the report comment on the PR

jobs:
  tree-identity:
    # Promotion PRs only. On any other PR this job is skipped,
    # and a skipped job counts as passed for a required check.
    if: (github.base_ref == 'test' && github.head_ref == 'main') || (github.base_ref == 'prod' && github.head_ref == 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a pull_request event, checkout gives you GitHub's precomputed
      # merge commit (refs/pull/N/merge), i.e. the post-merge state.
      - name: Compare predicted post-merge tree with the source branch
        id: cmp
        env:
          SRC: ${{ github.head_ref }}
          DST: ${{ github.base_ref }}
        run: |
          git fetch origin "$SRC" --quiet
          PRED=$(git rev-parse 'HEAD^{tree}')
          SRCT=$(git rev-parse "origin/$SRC^{tree}")
          echo "predicted tree after merge : $PRED"
          echo "source branch tree         : $SRCT"
          if [ "$PRED" = "$SRCT" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "OK: $DST will be byte-identical to $SRC"
            exit 0
          fi

          echo "match=false" >> "$GITHUB_OUTPUT"
          git diff --stat "origin/$SRC" HEAD > stat.txt
          git diff "origin/$SRC" HEAD > diff.txt

          # Commits on '$DST' (HEAD^1 = base side of the PR merge) that '$SRC' never received
          # and that touch the differing files: these are the changes to back-merge.
          mapfile -t FILES < <(git diff --name-only "origin/$SRC" HEAD)
          git log --no-merges --format='%H' "origin/$SRC..HEAD^1" -- "${FILES[@]}" > commits.txt

          echo "::error::After this merge, '$DST' will NOT match '$SRC'"
          echo ""
          echo "Files that will still differ:"
          sed 's/^/  /' stat.txt
          echo ""
          echo "Exact difference (- is $SRC, + is what $DST would have):"
          cat diff.txt
          echo ""
          echo "Commits on '$DST' that '$SRC' is missing:"
          while read -r sha; do
            git log -1 --format='  %h  %an  %ad  %s' --date=short "$sha"
          done < commits.txt
          echo ""
          echo "Most likely cause: a fix applied to '$DST' that never reached '$SRC'."

          {
            echo "### '$DST' would not match '$SRC' after this merge"
            echo '```diff'
            head -c 60000 diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place on every run, never duplicated.
      - name: Post or update the PR comment
        if: steps.cmp.outputs.match != ''
        continue-on-error: true   # a failed comment must not change the check result
        uses: actions/github-script@v7
        env:
          SRC: ${{ github.head_ref }}
          DST: ${{ github.base_ref }}
          MATCH: ${{ steps.cmp.outputs.match }}
        with:
          script: |
            const fs = require('fs');
            const { SRC, DST, MATCH } = process.env;
            const marker = '<!-- tree-identity-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            let body;
            if (MATCH === 'true') {
              if (!existing) return;   // nothing was ever wrong on this PR: stay quiet
              body = `${marker}\n✅ **Resolved.** After this merge, \`${DST}\` will match \`${SRC}\` exactly.`;
            } else {
              const stat = fs.readFileSync('stat.txt', 'utf8').trim();

              // Trace each responsible commit back to the PR that merged it into DST.
              const shas = fs.readFileSync('commits.txt', 'utf8').split('\n').filter(Boolean);
              const prs = new Map();
              const orphans = [];
              for (const sha of shas) {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                const hit = data.find(p => p.base.ref === DST && p.merged_at) || data.find(p => p.base.ref === DST);
                if (hit) {
                  if (!prs.has(hit.number)) prs.set(hit.number, { pr: hit, commits: [] });
                  prs.get(hit.number).commits.push(sha.slice(0, 7));
                } else {
                  orphans.push(sha.slice(0, 7));
                }
              }
              const traced = [...prs.values()].map(({ pr, commits }) =>
                `- #${pr.number} **${pr.title}** by @${pr.user.login} (\`${pr.head.ref}\` → \`${DST}\`), commits ${commits.join(', ')}`);
              for (const c of orphans) traced.push(`- ${c}: no PR found (pushed directly to \`${DST}\`?)`);
              const traceBlock = traced.length
                ? ['**Changes that never reached `' + SRC + '`:**', ...traced, '']
                : [];
              let diff = fs.readFileSync('diff.txt', 'utf8');
              const limit = 55000;     // GitHub comments max out at 65,536 characters
              const truncated = diff.length > limit;
              if (truncated) diff = diff.slice(0, limit);
              body = [
                marker,
                `❌ **After this merge, \`${DST}\` will NOT match \`${SRC}\`.**`,
                '',
                `Lines with \`+\` are on \`${DST}\` but missing from \`${SRC}\`, usually a fix that was never back-merged.`,
                `Lines with \`-\` are on \`${SRC}\` but would be missing from \`${DST}\`.`,
                '',
                ...traceBlock,
                '```',
                stat,
                '```',
                '',
                '<details open><summary>Exact difference</summary>',
                '',
                '```diff',
                diff,
                '```',
                truncated ? '\n_Diff truncated. The job log has the full output._' : '',
                '</details>',
              ].join('\n');
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail the check if the branches would differ
        if: steps.cmp.outputs.match == 'false'
        run: exit 1
